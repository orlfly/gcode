[package]
name = "gcode-tools"
version = "0.1.0"
edition = "2024"
description = "Gcode agent tools: schematic generation and ERC as jcode Tools"

[lib]
name = "gcode_tools"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
gcode-kicad = { path = "../gcode-kicad" }
jcode-tool-core = { path = "../jcode-tool-core" }
jcode-tool-types = { path = "../jcode-tool-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "fs", "rt", "macros"] }
async-trait = "0.1"
thiserror = "2"
