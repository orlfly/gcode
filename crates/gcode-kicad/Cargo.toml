[package]
name = "gcode-kicad"
version = "0.1.0"
edition = "2024"
description = "KiCad s-expression engine and netlist IR for the Gcode agent"

[lib]
name = "gcode_kicad"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "fs", "rt", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v5"] }
async-trait = "0.1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
