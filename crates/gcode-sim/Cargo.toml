[package]
name = "gcode-sim"
version = "0.1.0"
edition = "2024"
description = "ngspice-driven simulation for the Gcode agent: netlist generation, waveform retrieval, metric analysis"

[lib]
name = "gcode_sim"
path = "src/lib.rs"

[dependencies]
gcode-kicad = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
