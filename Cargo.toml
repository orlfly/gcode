[workspace]
members = ["crates/gcode-kicad", "crates/gcode-sim", "crates/gcode-instrument", "crates/gcode-laser", "crates/gcode-tools", "crates/gcode-agent"]
resolver = "3"

[workspace.dependencies]
gcode-kicad = { path = "crates/gcode-kicad" }
gcode-sim = { path = "crates/gcode-sim" }
gcode-instrument = { path = "crates/gcode-instrument" }
gcode-laser = { path = "crates/gcode-laser" }
gcode-tools = { path = "crates/gcode-tools" }
# jcode 本体（上游，只读）。用兄弟目录相对路径，兼容两种布局：
#   /opt/workspace/{gcode,jcode}  与  ~/workspace/{gcode,jcode}
jcode = { path = "../jcode" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
