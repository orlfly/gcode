[workspace]
members = ["crates/gcode-kicad", "crates/gcode-tools", "crates/gcode-agent"]
resolver = "3"

[workspace.dependencies]
gcode-kicad = { path = "crates/gcode-kicad" }
gcode-tools = { path = "crates/gcode-tools" }
jcode = { path = "/opt/workspace/jcode" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
