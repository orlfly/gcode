[workspace]
members = ["crates/gcode-kicad"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
gcode-kicad = { path = "crates/gcode-kicad" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "fs", "rt", "macros"] }
async-trait = "0.1"
anyhow = "1"
